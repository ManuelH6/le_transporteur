name: admin_le_transporteur
description: "Admin Control Center for Le Transporteur"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  shared_le_transporteur:
    path: ../../shared
  flutter_screenutil: ^5.9.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  google_fonts: ^8.0.1
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.70.2 # For analytics graphs
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../shared/assets/images/logo_orange_slog.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "../../shared/assets/images/logo_orange_slog.png"
  android_12:
    image: "../../shared/assets/images/logo_orange_slog.png"
    icon_background_color: "#FFFFFF"
  web: false
